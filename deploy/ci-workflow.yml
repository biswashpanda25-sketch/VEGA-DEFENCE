name: GOTHAM INDIA CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend tests, migrations, AI evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migration check
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests -q --maxfail=1
      - name: AI grounding evaluation
        working-directory: backend
        run: python -m tests.eval_ai
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          path: docs/ai_eval_results.json

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start web console
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
      - name: Run smoke test
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: frontend/e2e/screenshots

  security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || true   # advisory until findings triaged
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (high and above)
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Block committed secrets
        run: |
          if grep -rInE "(BEGIN (RSA|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})" --include="*.py" --include="*.ts" --include="*.tsx" .; then
            echo "Potential secret material detected"; exit 1
          fi
